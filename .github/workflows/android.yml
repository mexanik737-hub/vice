name: Android APK

on:
  push:
    branches: [main, master, 'release/**']
    paths:
      - 'android/**'
      - 'localization/**'
      - 'tools/**'
      - 'upstream/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'localization/**'
      - 'tools/**'
      - 'upstream/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build localized game HTML
        run: python tools/build_game.py
      - name: Static project tests
        run: python -m unittest discover -s tests -v
      - name: Localization runtime tests
        run: node tests/test_localization_runtime.cjs
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEY_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: viceburg-offline-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
